<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>预览测试 HTML</title>
</head>
<body>
  <h1>预览测试 HTML</h1>
  <p>这是一个 <strong>HTML 预览测试文件</strong>。如果你能看到下面的标题、段落、列表和链接，说明 HTML 预览正常。</p>
  <h2>二级标题</h2>
  <ul>
    <li>列表项 1</li>
    <li>列表项 2</li>
    <li>列表项 3</li>
  </ul>
  <h3>一段样式文字</h3>
  <p style="color: #0969da;">这行是蓝色文字（测试内联样式是否生效）。</p>
  <blockquote>这是一段引用文字。</blockquote>
  <p><a href="https://example.com">这是一个链接</a></p>
  <p><strong>加粗文字</strong> 和 <em>斜体文字</em>。</p>
  <h2>结束</h2>
  <p>如果你能看到这行，说明 HTML 预览完整渲染到了底部。</p>
</body>
</html>
